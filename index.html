<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aarke Jug - Premium Filter Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            iosBlue: '#007AFF',
            aarkeGold: '#C5A059',
            aarkeSteel: '#8E8E93',
            aarkeCharcoal: '#1C1C1E',
            premiumGray: '#F2F2F7',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* iOS Momentum Scrolling & WebApp Styling */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    /* Safe Area Inset Padding for iPhones with Notches */
    .safe-padding {
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    /* Smooth transitions for outer tracking wheel and water SVG components */
    #progress-ring-active, #water-liquid, #water-wave {
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Gentle floating animation for water inside the jug */
    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(2px) scaleY(1.05); }
    }
    .water-float {
      animation: waveFloat 4s ease-in-out infinite;
    }
    /* Hide default date picker arrow/icon for a cleaner iOS look, while keeping clickability */
    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent;
      bottom: 0;
      color: transparent;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      width: auto;
      height: auto;
    }
  </style>
</head>

        </div>
        <div>
          <h1 class="text-base font-black tracking-widest text-slate-900 uppercase">Aarke Jug</h1>
          <p class="text-[11px] text-slate-500 font-medium uppercase tracking-wider">Premium Filter Tracker</p>
        </div>
      </div>

      </button>
    </header>

              <stop offset="0%" stop-color="#0ea5e9" />

            </linearGradient>
          </defs>
          <circle 
            cx="110" 
            cy="110" 
            r="102" 
            stroke="#f1f5f9" 
            stroke-width="5" 
            fill="transparent" 
          />

            id="progress-ring-active"

            cy="110" 
            r="102" 
            stroke="url(#ring-gradient)" 
            stroke-width="6" 
            stroke-dasharray="640.88"
            stroke-dashoffset="640.88"
            stroke-linecap="round"
            fill="transparent" 
          />
        </svg>
